[tool.black]
line-length = 100
target-version = ["py312"]

exclude = '''
/(
    \.git
  | \.venv
  | \.venv-1
  | venv
  | build
  | dist
  | migrations
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"

exclude = [
    ".git",
    ".venv",
    ".venv-1",
    "venv",
    "build",
    "dist",
    "migrations",
    "__pycache__",
    "scripts", 
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.isort]
profile = "black"
skip = [
    ".venv",
    ".venv-1",
    "venv",
    "migrations",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
