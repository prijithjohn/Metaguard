name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: metaguard
          POSTGRES_USER: metaguard_user
          POSTGRES_PASSWORD: metaguard_pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U metaguard_user -d metaguard"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest coverage ruff black isort pre-commit
      - name: Lint
        run: |
          ruff check .
          black --check .
          isort --check-only .
      - name: Test
        env:
          DJANGO_SECRET_KEY: ci-secret
          DEBUG: 'False'
          DB_ENGINE: django.db.backends.postgresql
          POSTGRES_DB: metaguard
          POSTGRES_USER: metaguard_user
          POSTGRES_PASSWORD: metaguard_pass
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
        run: |
          pytest --maxfail=1 --disable-warnings
      - name: Docker build
        run: docker build .
